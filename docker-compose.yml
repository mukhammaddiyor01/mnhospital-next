version: "3.3"

services:
  mnhospital-next:
    container_name: mnhospital-next
    restart: always
    image: node:20.19.0
    ports:
      - 2002:4002
    environment:
      - PORT=4002
    volumes:
      - ./:/usr/src/mnhospital-next
    working_dir: /usr/src/mnhospital-next

    networks:
      - client-network

    # FOR PRODUCTION
    command:
      bash -c "yarn && yarn run build && yarn run start"

      # FOR PRODUCTION
    # command: bash -c "npm install && npm run start:dev"

networks:
  client-network:
    driver: bridge

# mnhospital-next: localhost:2002 <=> container: 4002
# mnhospital-api: localhost:2001 <=> container: 4001
# mnhospital-batch: localhost:2003 <=> container: 4003
