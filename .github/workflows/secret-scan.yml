name: Repository secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check tracked credential files
        run: node scripts/verify-repository-security.cjs
      - name: Install verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed files without exposing secrets
        run: |
          mkdir "$RUNNER_TEMP/committed-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/committed-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/committed-source" --config .gitleaks.toml --redact=100 --no-banner
      - name: Scan every newly pushed commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE_SHA" ] &&
            [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}"; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          else
            base=$(git merge-base origin/master "$GITHUB_SHA" || true)
            if [ -n "$base" ] && [ "$base" != "$GITHUB_SHA" ]; then
              range="$base..$GITHUB_SHA"
            else
              range="--max-count=1 $GITHUB_SHA"
            fi
          fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --config .gitleaks.toml --redact=100 --no-banner
