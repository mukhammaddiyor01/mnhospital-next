name: Repository secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check tracked credential files
        run: node scripts/verify-repository-security.cjs
      - name: Install verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed files without exposing secrets
        run: |
          mkdir "$RUNNER_TEMP/committed-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/committed-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/committed-source" --config .gitleaks.toml --redact=100 --no-banner
