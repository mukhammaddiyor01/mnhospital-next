name: Frontend quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web:standalone
      - run: npm run web:typecheck
      - run: npm run test:auth
      - run: npm run test:seo
      - run: node scripts/verify-booking-draft-reset.cjs
      - run: node scripts/verify-catalog-localization.cjs
      - run: node scripts/verify-booking-focus.cjs
      - run: node scripts/verify-preference-controls.cjs
      - run: node scripts/verify-doctor-directory.cjs
      - run: node scripts/verify-booking-submit.cjs
      - run: node scripts/verify-dark-contrast.cjs
      - run: node scripts/verify-repository-security.cjs
      - run: npm audit --omit=dev --audit-level=moderate
  mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run mobile:typecheck
      - run: npm run test:mobile:a11y
      - run: npm run test:mobile:localization
      - run: npm run test:mobile:services
      - run: npm run test:mobile:services:api
      - run: npm run test:mobile:services:refresh
      - run: npm run test:mobile:services:response
      - run: npm run test:mobile:services:timeout
      - run: npx expo install --check
        working-directory: apps/mobile
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-android"
        working-directory: apps/mobile
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-ios"
        working-directory: apps/mobile
