name: Frontend quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test:auth
      - run: node scripts/verify-booking-draft-reset.cjs
      - run: node scripts/verify-preference-controls.cjs
      - run: node scripts/verify-doctor-directory.cjs
      - run: node scripts/verify-booking-submit.cjs
      - run: node scripts/verify-dark-contrast.cjs
      - run: node scripts/verify-repository-security.cjs
      - run: npm audit --omit=dev --audit-level=high
